mpi-finalize-diagnostics:
  stage: test
  image: registry.dune-project.org/docker/ci/${MPI_DIAGNOSTIC_IMAGE}
  # Runner 33, shared-ci@tu-dresden.de. Set the variable to "dresden"
  # to select runner 1 (ci-tu-dresden) instead.
  tags: [duneci, "$MPI_DIAGNOSTIC_RUNNER_TAG"]
  timeout: 30m
  allow_failure: true
  parallel:
    matrix:
      - MPI_DIAGNOSTIC_IMAGE: "debian:12"
        DUNECI_TOOLCHAIN: "gcc-12-20"
      - MPI_DIAGNOSTIC_IMAGE: "debian:13"
        DUNECI_TOOLCHAIN: "gcc-14-23"
  variables:
    MPI_DIAGNOSTIC_RUNNER_TAG: "duneci-dresden"
    MPI_DIAGNOSTIC_ITERATIONS: "20"
    MPI_DIAGNOSTIC_JOBS: "4"
    DUNECI_BUILD_TYPE: Release
    DUNECI_CMAKE_FLAGS: "-DDUNE_MAX_TEST_CORES=4 -DDUNE_ENABLE_PYTHONBINDINGS=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE"
  rules:
    - if: '$MPI_FINALIZE_DIAGNOSTICS == "1"'
    - if: '$CI_COMMIT_BRANCH =~ /^diagnostics\/mpi-finalize/ || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^diagnostics\/mpi-finalize/'
    - when: manual
  script:
    - DUNECI_CONFIGURE_ONLY=1 duneci-standard-test
    - cmake --build build-cmake --parallel "${DUNECI_PARALLEL:-4}" --target remoteindicestest syncertest mpidatatest communicationtest
    - cmake -S tools/mpi-finalize -B build-mpi-finalize -DCMAKE_BUILD_TYPE=Release
    - cmake --build build-mpi-finalize --parallel 2
    - >-
      python3 tools/mpi-finalize/run.py
      --build-dir build-cmake
      --probe-build-dir build-mpi-finalize
      --output mpi-finalize-results
      --iterations "$MPI_DIAGNOSTIC_ITERATIONS"
      --jobs "$MPI_DIAGNOSTIC_JOBS"
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - mpi-finalize-results/
      - build-cmake/CMakeCache.txt
      - build-mpi-finalize/CMakeCache.txt
    reports:
      junit: mpi-finalize-results/junit.xml
